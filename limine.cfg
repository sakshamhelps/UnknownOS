# Unknown OS - Limine Bootloader Configuration
# Author: byrex <byrex.me@proton.me>

TIMEOUT=5
ENTRY=Unknown OS

:Unknown OS
    protocol=limine
    kernel_path=boot:///kernel.elf
    module_path=boot:///initrd.tar
    cmdline=loglevel=debug

:Unknown OS (Recovery)
    protocol=limine
    kernel_path=boot:///kernel.elf
    module_path=boot:///initrd.tar
    cmdline=loglevel=debug single