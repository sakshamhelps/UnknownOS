<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grubBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050510;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a1a;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="grubGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#007aff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#007aff;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="grubIndiaGlow" cx="80%" cy="70%" r="30%">
      <stop offset="0%" style="stop-color:#ff9933;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#ff9933;stop-opacity:0" />
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#grubBg)"/>
  <ellipse cx="960" cy="324" rx="900" ry="600" fill="url(#grubGlow)"/>
  <ellipse cx="1536" cy="756" rx="600" ry="400" fill="url(#grubIndiaGlow)"/>

  <!-- Subtle grid -->
  <pattern id="grubGrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.015)" stroke-width="1"/>
  </pattern>
  <rect width="1920" height="1080" fill="url(#grubGrid)"/>
