<?xml version="1.0" encoding="UTF-8"?>
<svg width="3840" height="2160" viewBox="0 0 3840 2160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d0d2a;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowGradient" cx="50%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#007aff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#007aff;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="indiaGlow" cx="80%" cy="70%" r="40%">
      <stop offset="0%" style="stop-color:#ff9933;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#ff9933;stop-opacity:0" />
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="80"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="3840" height="2160" fill="url(#bgGradient)"/>

  <!-- Glow effects -->
  <ellipse cx="1920" cy="648" rx="1800" ry="1200" fill="url(#glowGradient)" filter="url(#blur)"/>
  <ellipse cx="3072" cy="1512" rx="1200" ry="800" fill="url(#indiaGlow)" filter="url(#blur)"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
  </pattern>
  <rect width="3840" height="2160" fill="url(#grid)"/>

  <!-- Main logo area -->
  <g transform="translate(1920, 900)" text-anchor="middle">
    <!-- "UNKNOWN" -->
    <text x="0" y="-60" font-family="system-ui, -apple-system, sans-serif" font-size="120" font-weight="700" fill="#ffffff" letter-spacing="8">UNKNOWN</text>
    <!-- "OS" -->
    <text x="0" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="120" font-weight="200" fill="#007aff" letter-spacing="8">OS</text>
    <!-- Divider line -->
    <line x1="-200" y1="80" x2="200" y2="80" stroke="#007aff" stroke-width="3" opacity="0.6"/>
    <!-- Version -->
    <text x="0" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#8888aa" letter-spacing="4">1.0.0-IND</text>
    <!-- India Edition -->
    <text x="0" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="500" fill="#ff9933" letter-spacing="3">INDIA EDITION</text>
    <!-- Support -->
    <text x="0" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="300" fill="#666688">Support: byrex.me@proton.me</text>
  </g>

  <!-- Bottom accent bar -->
  <rect x="0" y="2100" width="3840" height="60" fill="url(#bgGradient)"/>
  <line x1="0" y1="2100" x2="3840" y2="2100" stroke="#007aff" stroke-width="2" opacity="0.3"/>

  <!-- Corner indicators -->
  <g stroke="#007aff" stroke-width="2" opacity="0.4" fill="none">
    <!-- Top-left -->
    <path d="M 80,80 h 120 M 80,80 v 120"/>
    <!-- Top-right -->
    <path d="M 3760,80 h -120 M 3760,80 v 120"/>
    <!-- Bottom-left -->
    <path d="M 80,2080 h 120 M 80,2080 v -120"/>
    <!-- Bottom-right -->
    <path d="M 3760,2080 h -120 M 3760,2080 v -120"/>
  </g>
</svg>