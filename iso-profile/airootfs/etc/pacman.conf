#
# /etc/pacman.conf - Unknown OS
#

[options]
RootDir     = /
DBPath      = /var/lib/pacman/
CacheDir    = /var/cache/pacman/pkg/
LogFile     = /var/log/pacman.log
GPGDir      = /etc/pacman.d/gnupg/
HookDir     = /etc/pacman.d/hooks/
HoldPkg     = pacman glibc
Architecture = auto
Color
CheckSpace
ParallelDownloads = 10
ILoveCandy
VerbosePkgLists

SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
RemoteFileSigLevel = Required

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[community]
Include = /etc/pacman.d/mirrorlist

# Multilib for 32-bit apps (Steam, Wine, etc.)
[multilib]
Include = /etc/pacman.d/mirrorlist

# Unknown OS Custom Repository (for branded packages)
#[unknownos]
#SigLevel = Optional TrustAll
#Server = https://repo.byrex.me/$arch

# Brave Browser Repository (official)
[brave-browser]
SigLevel = PackageRequired
Server = https://brave-browser-apt-release.s3.brave.com/$arch/