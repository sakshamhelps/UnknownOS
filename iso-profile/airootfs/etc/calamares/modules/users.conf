---
# Users module configuration
module: users

# Default groups for new user
defaultGroups:
  - wheel
  - networkmanager
  - video
  - audio
  - storage
  - power
  - lp
  - scanner
  - kvm
  - libvirt

# Autologin group
autologinGroup: autologin

# Sudoers group
sudoersGroup: wheel

# Set root password
setRootPassword: true

# Available shells
availableShells:
  - /bin/bash
  - /bin/zsh
  - /bin/fish

# Default shell
defaultShell: /bin/zsh

# User password requirements
passwordStrength: "medium"

# Allow empty password (not recommended)
allowEmptyPassword: false

# Autologin checkbox
autologin: false

# Face icon
faceIcon: "/usr/share/icons/unknownos.svg"

# Default user avatar
defaultAvatar: "/usr/share/icons/unknownos.svg"