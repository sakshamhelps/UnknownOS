---
# Locale module configuration
module: locale

# Default locale
defaultLocale: "en_IN.UTF-8"

# Default timezone
defaultZone: "Asia/Kolkata"

# Available locales (from locale.gen)
locales:
  - "en_IN.UTF-8"
  - "hi_IN.UTF-8"
  - "bn_IN.UTF-8"
  - "te_IN.UTF-8"
  - "mr_IN.UTF-8"
  - "ta_IN.UTF-8"
  - "gu_IN.UTF-8"
  - "ur_IN.UTF-8"
  - "kn_IN.UTF-8"
  - "or_IN.UTF-8"
  - "ml_IN.UTF-8"
  - "pa_IN.UTF-8"
  - "as_IN.UTF-8"
  - "mai_IN.UTF-8"
  - "sat_IN.UTF-8"
  - "ks_IN.UTF-8"
  - "ne_IN.UTF-8"
  - "sd_IN.UTF-8"
  - "kok_IN.UTF-8"
  - "brx_IN.UTF-8"
  - "mni_IN.UTF-8"
  - "en_US.UTF-8"
  - "en_GB.UTF-8"

# Timezones (common)
timezones:
  - "Asia/Kolkata"
  - "Asia/Dubai"
  - "Asia/Singapore"
  - "Asia/Tokyo"
  - "Asia/Shanghai"
  - "Europe/London"
  - "Europe/Paris"
  - "Europe/Berlin"
  - "America/New_York"
  - "America/Los_Angeles"
  - "America/Chicago"
  - "America/Denver"
  - "Australia/Sydney"
  - "UTC"