---
# Partition module configuration
module: partition
backend: "pms"

# Automatically detect other OSes
osprober: true

# Show detailed partition info
showDetails: true

# Default filesystem
defaultFilesystem: "ext4"

# Default partition scheme
defaultPartitionScheme: "home"

# Partition schemes
partitionSchemes:
  - name: "auto"
    label: "Erase disk (automatic)"
    description: "Use entire disk, create partitions automatically"
    partitions:
      - mountPoint: "/"
        filesystem: "ext4"
        size: "100%"
        flags: [ "boot" ]
  - name: "home"
    label: "Erase disk (separate /home)"
    description: "Use entire disk, separate root and home partitions"
    partitions:
      - mountPoint: "/"
        filesystem: "ext4"
        size: "50GiB"
        flags: [ "boot" ]
      - mountPoint: "/home"
        filesystem: "ext4"
        size: "100%"
  - name: "lvm"
    label: "Use LVM"
    description: "Use entire disk with LVM"
    lvm: true
    partitions:
      - mountPoint: "/"
        filesystem: "ext4"
        size: "50GiB"
        flags: [ "boot" ]
      - mountPoint: "/home"
        filesystem: "ext4"
        size: "100%"
  - name: "encrypted"
    label: "Encrypted installation (LUKS)"
    description: "Use entire disk with full disk encryption"
    luks: true
    partitions:
      - mountPoint: "/"
        filesystem: "ext4"
        size: "100%"
        flags: [ "boot" ]

# Minimum disk size (bytes)
minimumDiskSize: 21474836480

# Swap
swapSize: "8GiB"
swapPartition: true

# EFI partition size
efiPartitionSize: "512MiB"