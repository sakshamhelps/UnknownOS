---
# Keyboard module configuration
module: keyboard

# Default layout
defaultLayout: "us"

# Default variant
defaultVariant: ""

# Available layouts
layouts:
  - "us"
  - "in"
  - "gb"
  - "de"
  - "fr"
  - "es"
  - "it"
  - "jp"
  - "kr"
  - "cn"

# Available variants for 'us' layout
variants:
  us: [ "", "dvorak", "colemak", "intl" ]
  in: [ "eng", "hin", "ben", "guj", "kan", "mal", "mar", "ori", "pan", "tam", "tel", "urd" ]

# Model
model: "pc105"

# Options
options: "grp:alt_shift_toggle,grp_led:scroll"