---
# Calamares Installer Settings - Unknown OS
installerName: "Unknown OS Installer"
windowTitle: "Install Unknown OS"
windowIcon: "/usr/share/icons/unknownos.svg"

branding: "unknownos"

promptInstall: true

setupMode: "install"
setupIcon: "system-software-install"

debugMode: false
logMode: "file"

sequence:
    - show:
        - welcome
        - locale
        - keyboard
        - partition
        - users
        - summary
    - exec:
        - install
        - bootloader
        - displaymanager
        - fstab
        - locale
        - keyboard
        - packages
        - users
        - hwclock
        - networkcfg
        - services
        - grubcfg
        - initcpiocfg
        - postcfg
        - umount
    - show:
        - finished

# Default modules
modules-search: [ "local" ]
module-search: [ "local" ]

# Locale module
locale:
    defaultLocale: "en_IN"
    defaultZone: "Asia/Kolkata"

# Keyboard module
keyboard:
    defaultLayout: "us"
    defaultVariant: ""

# Partition module
partition:
    defaults:
        filesystem: "ext4"
        mountPoint: "/"
        size: "100%"
        label: "UNKNOWN_OS"
        flags: [ "boot" ]

# Users module
users:
    defaultGroups: [ "wheel", "networkmanager", "video", "audio", "storage", "power", "lp", "scanner", "kvm", "libvirt" ]
    autologinGroup: "autologin"
    sudoersGroup: "wheel"
    setRootPassword: true
    availableShells: [ "/bin/bash", "/bin/zsh", "/bin/fish" ]
    defaultShell: "/bin/zsh"

# Display manager module
displaymanager:
    default: "sddm"

# Services module
services:
    enabled:
        - NetworkManager
        - sddm
        - bluetooth
        - firewalld
        - cups
        - tlp
        - fstrim.timer
        - systemd-timesyncd
        - systemd-resolved
        - systemd-oomd

# Bootloader module
bootloader:
    grubOptions: "--target=x86_64-efi --efi-directory=/boot/efi --bootloader-id=UnknownOS --recheck"
    efiDirectory: "/boot/efi"

# Package manager module
packages:
    manager: "pacman"
    updateDatabase: true

# Post configuration
postcfg:
    commands:
        - "systemctl enable NetworkManager"
        - "systemctl enable sddm"
        - "systemctl enable bluetooth"
        - "systemctl enable firewalld"
        - "systemctl enable cups"
        - "systemctl enable tlp"
        - "systemctl enable fstrim.timer"
        - "systemctl enable systemd-timesyncd"
        - "systemctl enable systemd-resolved"
        - "systemctl enable systemd-oomd"
        - "systemctl enable reflector.timer"
        - "systemctl enable paccache.timer"
        - "flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo"
        - "flatpak install -y flathub com.brave.Browser"
        - "grub-mkconfig -o /boot/grub/grub.cfg"