[general]
version=1.5.29
use-system-keyboard-layout=false
preload-engines=['xkb:us::eng', 'm17n:hi:inscript', 'm17n:bn:probhat', 'm17n:ta:tamil99', 'm17n:te:inscript', 'm17n:mr:inscript', 'm17n:gu:inscript', 'm17n:kn:inscript', 'm17n:ml:inscript', 'm17n:pa:inscript', 'm17n:or:inscript', 'm17n:as:inscript']
embedded-preload-engines=[]
active=True
show-icon-on-systray=True
show-icon-on-menu=True
panel-lookup-keys=Control+space
panel-show-hide-keys=Super+space
switcher-hotkeys=Control+space;Super+space
next-engine-hotkeys=Control+Shift+space
prev-engine-hotkeys=Shift+Super+space
use-global-engine=False
global-engine=xkb:us::eng
embed-preedit-text-in-application=False
enable-surrounding-text=True
enable-candidate-navigation-by-word=True
gtk3-client=False
use-xmodifier=True
xmodifier=@im=ibus

[panel]
lookup-table-orientation=1
candidate-orientation=1
font=Noto Sans 10
show-im-name=True
show-icon-on-button=True
show-label-on-button=False
candidates-on-single-line=False
auto-hide-timeout=0
page-size=9
round-corner-radius=8
opacity=0.9

[engine/hotkey]
trigger=Control+space
next-engine=Control+Shift+space
prev-engine=Shift+Super+space