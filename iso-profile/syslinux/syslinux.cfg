UI menu.c32
PROMPT 0
MENU TITLE Unknown OS - Boot Menu
MENU BACKGROUND unknownos-splash.png
MENU COLOR border       30;44   #40ffffff #a0000000 std
MENU COLOR title        1;36;44 #9033ccff #a0000000 std
MENU COLOR sel          7;37;40 #e0ffffff #20ffffff all
MENU COLOR unsel        37;44   #50ffffff #a0000000 std
MENU COLOR help         37;40   #c0ffffff #a0000000 std
MENU COLOR timeout_msg  37;40   #80ffffff #00000000 std
MENU COLOR timeout      1;37;40 #c0ffffff #00000000 std
MENU COLOR msg07        37;40   #90ffffff #a0000000 std
MENU COLOR tabmsg       31;40   #30ffffff #00000000 std

MENU WIDTH 78
MENU MARGIN 4
MENU ROWS 5
MENU VSHIFT 10
MENU TABMSGROW 14
MENU CMDLINEROW 14
MENU ENDROW 24
MENU PASSWORDMARGIN 16
MENU PASSWORDROW 12
MENU TIMEOUTROW 13

TIMEOUT 50

DEFAULT unknownos

LABEL unknownos
    MENU LABEL Unknown OS 1.0.0-IND (Live)
    MENU DEFAULT
    LINUX /arch/boot/x86_64/vmlinuz-linux
    INITRD /arch/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=arch archisolabel=UNKNOWN_OS_IND quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0

LABEL unknownos-nomodeset
    MENU LABEL Unknown OS 1.0.0-IND (Safe Mode / nomodeset)
    LINUX /arch/boot/x86_64/vmlinuz-linux
    INITRD /arch/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=arch archisolabel=UNKNOWN_OS_IND quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0 nomodeset

LABEL unknownos-install
    MENU LABEL Install Unknown OS to Disk
    LINUX /arch/boot/x86_64/vmlinuz-linux
    INITRD /arch/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=arch archisolabel=UNKNOWN_OS_IND quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0 calamares=auto

LABEL memtest
    MENU LABEL Memory Test (memtest86+)
    LINUX /arch/boot/x86_64/memtest86+
    INITRD /arch/boot/x86_64/initramfs-linux.img

LABEL hdt
    MENU LABEL Hardware Detection Tool (HDT)
    LINUX /arch/boot/x86_64/hdt
    INITRD /arch/boot/x86_64/initramfs-linux.img

LABEL reboot
    MENU LABEL Reboot
    COM32 reboot.c32

LABEL poweroff
    MENU LABEL Power Off
    COM32 poweroff.c32